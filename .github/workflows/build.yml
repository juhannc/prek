name: Build docker image and push

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 0 0 * * 0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ${{ fromJSON(github.event_name == 'pull_request' && '["latest", "3.15-rc"]' || '["latest", "3.15-rc", "3.15-rc-slim", "3.14", "3.14-slim", "3.13", "3.13-slim", "3.12", "3.12-slim"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PYTHON_VERSION=${{ matrix.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/prek:${{ matrix.tag }}
